# เผยแพร่แอปขึ้น GitHub Pages อัตโนมัติทุกครั้งที่มีการ push
# เพื่อให้นักเรียนเปิดใช้งานจากมือถือได้ผ่านลิงก์เดียว โดยไม่ต้องติดตั้งอะไร
name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/mva-scraping-ant-app-komotb", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # เปิดใช้งาน GitHub Pages ให้อัตโนมัติหากยังไม่ได้เปิดไว้
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
