<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b3235c">
<title>ใส่ห่วงอนามัย — คู่มือหัตถการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   สอนใส่ห่วงอนามัย — mobile-first stylesheet
   ========================================================= */

:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-2:#eef1f5;
  --text:#111827;
  --text-dim:#5b6472;
  --line:#dfe3e9;
  --brand:#b3235c;
  --brand-soft:#fce7f0;
  --accent:#0e7490;
  --accent-soft:#e0f2fe;
  --warn:#b45309;
  --warn-soft:#fef3c7;
  --danger:#b91c1c;
  --danger-soft:#fee2e2;
  --good:#15803d;
  --good-soft:#dcfce7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --r:14px;
  --tabh:62px;
  --font:"Noto Sans Thai","Sarabun",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216;
    --surface:#171b21;
    --surface-2:#1e242c;
    --text:#e7eaee;
    --text-dim:#9aa4b2;
    --line:#2a313a;
    --brand:#f472b6;
    --brand-soft:#3b1729;
    --accent:#38bdf8;
    --accent-soft:#0c2a3a;
    --warn:#fbbf24;
    --warn-soft:#3a2c0a;
    --danger:#f87171;
    --danger-soft:#3b1414;
    --good:#4ade80;
    --good-soft:#0f2e1c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --surface-2:#1e242c;
  --text:#e7eaee; --text-dim:#9aa4b2; --line:#2a313a;
  --brand:#f472b6; --brand-soft:#3b1729;
  --accent:#38bdf8; --accent-soft:#0c2a3a;
  --warn:#fbbf24; --warn-soft:#3a2c0a;
  --danger:#f87171; --danger-soft:#3b1414;
  --good:#4ade80; --good-soft:#0f2e1c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{ -webkit-text-size-adjust:100% }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:16px; line-height:1.65;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{line-height:1.35;margin:0}
b,strong{font-weight:700;color:var(--text)}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- app bar ---------- */
.appbar{
  position:sticky; top:0; z-index:40;
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  display:flex; align-items:center; gap:10px;
}
.appbar .mark{
  width:34px;height:34px;border-radius:10px;flex:0 0 auto;
  background:var(--brand-soft); color:var(--brand);
  display:grid;place-items:center;font-size:18px;
}
.appbar .ttl{flex:1;min-width:0}
.appbar .ttl h1{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ttl p{margin:0;font-size:11.5px;color:var(--text-dim)}
.iconbtn{
  border:1px solid var(--line); background:var(--surface-2);
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-size:17px;cursor:pointer;flex:0 0 auto;
}
.iconbtn:active{transform:scale(.94)}

/* ---------- layout ---------- */
main{padding:14px 14px 26px;max-width:820px;margin:0 auto}
.view{display:none;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;
}
.card-pad{padding:14px}
.sec-title{
  font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--text-dim);
  text-transform:uppercase;margin:20px 2px 8px;
}
.sec-title:first-child{margin-top:2px}

/* ---------- accordion ---------- */
.acc-head{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:14px;background:none;border:0;text-align:right;cursor:pointer;
}
.acc-head .ic{font-size:20px;flex:0 0 auto}
.acc-head .tx{flex:1;font-weight:700;font-size:15.5px;text-align:left}
.acc-head .ch{color:var(--text-dim);transition:transform .2s;font-size:13px}
.acc.open .acc-head .ch{transform:rotate(180deg)}
.acc-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.acc.open .acc-body{display:block}
.acc-body>*:first-child{margin-top:12px}

/* ---------- content blocks ---------- */
.blk{margin:12px 0}
.blk ul{margin:0;padding-inline-start:20px}
.blk li{margin:7px 0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:440px;font-size:14px}
th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:700;font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}

.callout{border-radius:12px;padding:12px 13px;font-size:14.5px;border:1px solid transparent}
.callout .ct{font-weight:700;display:block;margin-bottom:3px;font-size:14px}
.callout.info{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.callout.warn{background:var(--warn-soft);border-color:var(--warn)}
.callout.good{background:var(--good-soft);border-color:var(--good)}
.callout.danger{background:var(--danger-soft);border-color:var(--danger)}

.mini-check{list-style:none;padding:0;margin:0}
.mini-check li{padding-inline-start:26px;position:relative;margin:8px 0;font-size:14.5px}
.mini-check li::before{
  content:"✓";position:absolute;inset-inline-start:0;top:0;
  color:var(--good);font-weight:700;
}

/* ---------- step list ---------- */
.phasebar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.phasebar::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:7px 13px;font-size:13.5px;white-space:nowrap;cursor:pointer;font-weight:600;
}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

.step{margin-bottom:10px}
.step .acc-head{align-items:flex-start}
.num{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  font-weight:700;font-size:14px;background:var(--surface-2);color:var(--text-dim);
}
.step.done .num{background:var(--good);color:#fff}
.step .tx{font-size:15px;line-height:1.45}
.phase-tag{
  display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--text-dim);margin-bottom:5px;
}
.do-list{list-style:none;padding:0;margin:0;counter-reset:d}
.do-list li{
  counter-increment:d;position:relative;padding-inline-start:28px;margin:9px 0;font-size:15px;
}
.do-list li::before{
  content:counter(d);position:absolute;inset-inline-start:0;top:2px;
  width:20px;height:20px;border-radius:6px;background:var(--brand-soft);color:var(--brand);
  font-size:11.5px;font-weight:700;display:grid;place-items:center;
}
.why,.pit{border-radius:11px;padding:11px 12px;font-size:14px;margin-top:11px}
.why{background:var(--accent-soft);border:1px solid var(--accent)}
.pit{background:var(--danger-soft);border:1px solid var(--danger)}
.why .lb,.pit .lb{font-weight:700;display:block;margin-bottom:2px;font-size:13px}
.stepfoot{display:flex;gap:8px;margin-top:13px}
.btn{
  flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;
  padding:11px;font-weight:700;font-size:14.5px;cursor:pointer;
}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:var(--surface)}
.btn:active{transform:scale(.98)}

/* ---------- diagrams ---------- */
.figure{margin:13px 0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.figure svg{width:100%;height:auto;display:block}
.dg-organ{fill:var(--brand-soft);stroke:var(--brand);stroke-width:2}
.dg-cavity{fill:var(--surface);stroke:var(--brand);stroke-width:1.4}
.dg-cervix{fill:var(--surface-2);stroke:var(--brand);stroke-width:2}
.dg-canal{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:3 3}
.dg-os{fill:var(--brand);opacity:.85}
.dg-tool,.dg-tube{fill:none;stroke:var(--text-dim);stroke-width:3.4;stroke-linecap:round}
.dg-rod{stroke:var(--accent);stroke-width:1.8;stroke-linecap:round}
.dg-toolTip{fill:var(--accent)}
.dg-iud{fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round}
.dg-flange{fill:var(--accent)}
.dg-mark{fill:var(--danger);opacity:.9}
.dg-marklabel{fill:#fff;font-size:9px;font-weight:700}
.dg-measure{stroke:var(--text-dim);stroke-width:1.2}
.dg-arrow{fill:none;stroke:var(--good);stroke-width:2.2}
.dg-arrowhead{fill:var(--good)}
.dg-div{stroke:var(--line);stroke-width:1.4;stroke-dasharray:4 4}
.dg-title{fill:var(--text);font-size:11px;font-weight:700}
.dg-note{fill:var(--text-dim);font-size:10.5px}
.dg-tick{fill:var(--text-dim);font-size:10px}
.dg-strong{fill:var(--text);font-weight:700}
.dg-warn{fill:var(--danger);font-size:10.5px;font-weight:700}
svg text{font-family:var(--font)}

/* ---------- progress ---------- */
.prog{display:flex;align-items:center;gap:10px;padding:12px 14px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.prog .pct{font-size:13px;font-weight:700;color:var(--text-dim);flex:0 0 auto}

/* ---------- quiz ---------- */
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);margin-bottom:8px}
.qtext{font-size:16px;font-weight:700;margin-bottom:12px;line-height:1.55}
.opt{
  display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);
  border-radius:12px;padding:12px 13px;margin-bottom:9px;cursor:pointer;font-size:15px;line-height:1.5;
}
.opt:disabled{cursor:default}
.opt.correct{background:var(--good-soft);border-color:var(--good);font-weight:700}
.opt.wrong{background:var(--danger-soft);border-color:var(--danger)}
.exp{margin-top:6px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px;font-size:14.5px}
.exp .lb{font-weight:700;display:block;margin-bottom:3px}
.score{text-align:center;padding:22px 14px}
.score .big{font-size:44px;font-weight:800;color:var(--brand);line-height:1.1}
.score .sub{color:var(--text-dim);font-size:14px;margin:6px 0 16px}

/* ---------- rubric ---------- */
.rub-item{padding:12px 14px;border-bottom:1px solid var(--line)}
.rub-item:last-child{border-bottom:0}
.rub-item .lbl{font-size:14.5px;margin-bottom:9px;display:flex;gap:7px;align-items:flex-start}
.crit{font-size:10px;font-weight:800;color:var(--danger);border:1px solid var(--danger);
  border-radius:5px;padding:1px 5px;flex:0 0 auto;margin-top:3px}
.rate{display:flex;gap:6px}
.rate button{
  flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;
  padding:8px 4px;font-size:12.5px;font-weight:600;cursor:pointer;
}
.rate button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rate button[data-v="2"].on{background:var(--good);border-color:var(--good)}
.rate button[data-v="0"].on{background:var(--danger);border-color:var(--danger)}
.group-head{
  padding:11px 14px;background:var(--surface-2);font-weight:700;font-size:14px;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;
}
.group-head span{color:var(--text-dim);font-weight:600;font-size:13px}

/* ---------- trouble cards ---------- */
.tag{
  display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;
  background:var(--warn-soft);color:var(--warn);margin-bottom:6px;
}
.sub-lb{font-weight:700;font-size:13.5px;margin:11px 0 4px;color:var(--text-dim)}
.pains{list-style:none;padding:0;margin:0}
.pains li{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.pains li:last-child{border-bottom:0}
.pains .k{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--danger);color:#fff;font-weight:800;
}
.pains .en{font-size:12px;color:var(--text-dim)}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;inset-inline:0;bottom:0;z-index:50;
  background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  border:0;background:none;padding:8px 2px 9px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--text-dim);font-weight:600;
}
.tabbar button .ti{font-size:20px;line-height:1}
.tabbar button.on{color:var(--brand)}

.note{font-size:12.5px;color:var(--text-dim);line-height:1.6}
.ref{font-size:12.5px;color:var(--text-dim);margin:6px 0}
.hidden{display:none !important}

.btn.small{flex:0 0 auto;padding:8px 13px;font-size:13px;font-weight:600;color:var(--text-dim)}

</style>
</head>
<body>
<header class="appbar">
  <div class="mark">⚕️</div>
  <div class="ttl">
    <h1>การใส่ห่วงอนามัย (IUD)</h1>
    <p>คู่มือหัตถการสำหรับนักศึกษาแพทย์</p>
  </div>
  <button class="iconbtn" id="themeBtn" aria-label="สลับธีมสว่าง/มืด">🌓</button>
</header>

<main>
  <section class="view on" id="v-learn"></section>
  <section class="view" id="v-steps"></section>
  <section class="view" id="v-trouble"></section>
  <section class="view" id="v-rubric"></section>
  <section class="view" id="v-quiz"></section>
</main>

<nav class="tabbar" id="tabbar" aria-label="เมนูหลัก">
  <button data-v="learn"   class="on"><span class="ti">📚</span>เรียนรู้</button>
  <button data-v="steps"><span class="ti">🩺</span>หัตถการ</button>
  <button data-v="trouble"><span class="ti">⚠️</span>ปัญหา</button>
  <button data-v="rubric"><span class="ti">✅</span>ประเมิน</button>
  <button data-v="quiz"><span class="ti">🧠</span>ควิซ</button>
</nav>
<script>
/* ------------------------------------------------------------------
 * content.js — เนื้อหาทั้งหมดของแอปสอนหัตถการ "การใส่ห่วงอนามัย (IUD)"
 * สำหรับนักศึกษาแพทย์ / แพทย์ใช้ทุน
 * อ้างอิงหลัก: WHO MEC 5th ed., WHO Selected Practice Recommendations,
 *              CDC US-SPR 2024, แนวทางกรมอนามัย กระทรวงสาธารณสุข
 * ------------------------------------------------------------------ */

const CONTENT = {};

/* ============ 1. เรียนรู้พื้นฐาน ============ */
CONTENT.learn = [
  {
    id: "types",
    title: "ชนิดของห่วงอนามัย",
    icon: "🧩",
    blocks: [
      {
        type: "table",
        head: ["หัวข้อ", "Cu-IUD (ห่วงทองแดง)", "LNG-IUS (ห่วงฮอร์โมน)"],
        rows: [
          ["รุ่นที่ใช้บ่อย", "TCu-380A, Cu-375", "LNG 52 mg, LNG 19.5 mg"],
          ["อายุการใช้งาน", "10–12 ปี (TCu-380A)", "5–8 ปี แล้วแต่รุ่น/ข้อบ่งใช้"],
          ["กลไกหลัก", "ไอออนทองแดงเป็นพิษต่ออสุจิ + ทำให้เยื่อบุโพรงมดลูกอักเสบแบบปลอดเชื้อ", "ทำให้มูกปากมดลูกข้น + เยื่อบุโพรงมดลูกฝ่อ ไม่ยับยั้งการตกไข่ในคนส่วนใหญ่"],
          ["ผลต่อประจำเดือน", "มักมามากขึ้น / ปวดท้องมากขึ้นใน 3–6 เดือนแรก", "เลือดออกกะปริดกะปรอยช่วงแรก แล้วประจำเดือนน้อยลง 20% ขาดประจำเดือนที่ 1 ปี"],
          ["ใช้คุมกำเนิดฉุกเฉินได้", "ได้ ภายใน 5 วันหลังมีเพศสัมพันธ์ (วิธีที่ได้ผลที่สุด)", "ไม่ใช่ทางเลือกหลัก"],
          ["ข้อบ่งใช้เสริม", "—", "เลือดออกผิดปกติจากโพรงมดลูก, ปวดประจำเดือน, endometrial protection ขณะให้เอสโตรเจน"]
        ]
      },
      {
        type: "callout",
        tone: "info",
        title: "ประสิทธิภาพ",
        text: "ทั้งสองชนิดเป็น LARC ที่มีอัตราล้มเหลว < 1 ต่อ 100 ผู้ใช้ต่อปี และไม่ขึ้นกับวินัยผู้ใช้ (typical use ≈ perfect use) จึงเทียบเท่าการทำหมันในแง่ประสิทธิภาพ แต่กลับคืนสภาพเจริญพันธุ์ได้ทันทีเมื่อถอดออก"
      }
    ]
  },
  {
    id: "timing",
    title: "จังหวะเวลาที่ใส่ได้",
    icon: "🗓️",
    blocks: [
      {
        type: "list",
        items: [
          "<b>ช่วงใดของรอบเดือนก็ได้</b> ถ้ามั่นใจพอสมควรว่าไม่ตั้งครรภ์ (reasonably certain not pregnant) — ไม่จำเป็นต้องรอให้มีประจำเดือน",
          "<b>หลังคลอด</b>: ภายใน 48 ชั่วโมงแรก (post-placental / immediate postpartum) หรือรอ ≥ 4 สัปดาห์ — ช่วง 48 ชม. ถึง 4 สัปดาห์ควรเลี่ยงเพราะหลุดง่ายและเสี่ยงทะลุสูงขึ้น",
          "<b>หลังแท้ง</b>: ใส่ได้ทันทีหลังแท้งไตรมาสแรกหรือไตรมาสสอง ถ้าไม่มีการติดเชื้อ",
          "<b>คุมกำเนิดฉุกเฉิน</b>: Cu-IUD ภายใน 5 วันหลังมีเพศสัมพันธ์ที่ไม่ได้ป้องกัน หรือภายใน 5 วันหลังวันตกไข่ที่คาดคะเน",
          "<b>ให้นมบุตร</b>: ใช้ได้ทั้งสองชนิด ไม่รบกวนน้ำนม"
        ]
      },
      {
        type: "callout",

/* ------------------------------------------------------------------
 * app.js — ตรรกะการแสดงผลและการเก็บความคืบหน้า
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ---------- storage ---------- */
  const KEY = "iud-app-v1";
  let state = { doneSteps: [], rubric: {}, theme: null, quizBest: null };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) { /* โหมดส่วนตัว หรือปิดการเก็บข้อมูล — ใช้ค่าเริ่มต้น */ }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  /* ---------- theme ---------- */
  if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
  $("#themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const isDark = cur ? cur === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    state.theme = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", state.theme);
    save();
  });

  /* ---------- tabs ---------- */
  $("#tabbar").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    $$("#tabbar button").forEach((x) => x.classList.toggle("on", x === b));
    $$(".view").forEach((v) => v.classList.toggle("on", v.id === "v-" + b.dataset.v));
    window.scrollTo({ top: 0 });
  });

  /* ---------- accordion (มอบหมายเหตุการณ์ครั้งเดียว) ---------- */
  document.addEventListener("click", (e) => {
    const h = e.target.closest(".acc-head");
    if (!h) return;
    const acc = h.closest(".acc");
    const open = acc.classList.toggle("open");
    h.setAttribute("aria-expanded", String(open));
  });

  /* =========================================================
     มุมมองที่ 1 — เรียนรู้
     ========================================================= */
  function renderBlock(b) {
    if (b.type === "table") {
      return '<div class="blk tablewrap"><table><thead><tr>' +
        b.head.map((h) => "<th>" + h + "</th>").join("") +
        "</tr></thead><tbody>" +
        b.rows.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") +
        "</tbody></table></div>";
    }
    if (b.type === "list") {
      return '<div class="blk"><ul>' + b.items.map((i) => "<li>" + i + "</li>").join("") + "</ul></div>";
    }
    if (b.type === "callout") {
      return '<div class="blk callout ' + b.tone + '"><span class="ct">' + b.title + "</span>" + b.text + "</div>";
    }
    if (b.type === "checklist") {
      return '<div class="blk"><div class="sub-lb">' + b.title + '</div><ul class="mini-check">' +
        b.items.map((i) => "<li>" + i + "</li>").join("") + "</ul></div>";
    }
    return "";
  }

  function renderLearn() {
    let h = '<div class="card card-pad">' +
      '<h2 style="font-size:17px;margin-bottom:6px">ก่อนเริ่มฝึก</h2>' +
      '<p class="note">แอปนี้ใช้ประกอบการฝึกหัตถการกับหุ่นจำลองและภายใต้การกำกับของอาจารย์ ' +
      'ไม่ใช้แทนการตัดสินใจทางคลินิกหรือแนวปฏิบัติของสถาบัน ' +
      'แตะหัวข้อเพื่อเปิดอ่าน ความคืบหน้าและคะแนนจะถูกเก็บไว้ในเครื่องของคุณเท่านั้น</p></div>';

    h += '<div class="sec-title">พื้นฐานที่ต้องรู้ก่อนลงมือ</div>';
    CONTENT.learn.forEach((sec) => {
      h += '<div class="card acc"><button class="acc-head" aria-expanded="false">' +
        '<span class="ic">' + sec.icon + '</span>' +
        '<span class="tx">' + esc(sec.title) + "</span>" +
        '<span class="ch">▾</span></button>' +
        '<div class="acc-body">' + sec.blocks.map(renderBlock).join("") + "</div></div>";
    });

    h += '<div class="card card-pad"><div class="sub-lb">แหล่งอ้างอิงเนื้อหา</div>' +
      '<p class="ref">WHO Medical Eligibility Criteria for Contraceptive Use, 5th ed.</p>' +
      '<p class="ref">WHO Selected Practice Recommendations for Contraceptive Use, 3rd ed.</p>' +
      '<p class="ref">CDC U.S. Selected Practice Recommendations for Contraceptive Use</p>' +
      '<p class="ref">แนวทางการให้บริการคุมกำเนิด สำนักอนามัยการเจริญพันธุ์ กรมอนามัย</p>' +
      '<p class="note" style="margin-top:8px">ตรวจสอบเทียบกับแนวปฏิบัติล่าสุดของโรงพยาบาลที่ปฏิบัติงานเสมอ</p></div>';

    $("#v-learn").innerHTML = h;
  }

  /* =========================================================
     มุมมองที่ 2 — ขั้นตอนหัตถการ
     ========================================================= */
  let phaseFilter = "all";

  function stepHTML(s) {
    const done = state.doneSteps.indexOf(s.id) !== -1;
    const ph = CONTENT.phases.filter((p) => p.id === s.phase)[0];
    let b = '<span class="phase-tag">' + ph.name + "</span>" +
      '<ul class="do-list">' + s.do.map((d) => "<li>" + d + "</li>").join("") + "</ul>";
    if (s.diagram && DIAGRAMS[s.diagram]) b += '<div class="figure">' + DIAGRAMS[s.diagram] + "</div>";
    b += '<div class="why"><span class="lb">ทำไมต้องทำแบบนี้</span>' + s.why + "</div>";
    b += '<div class="pit"><span class="lb">จุดที่มักพลาด</span>' + s.pitfall + "</div>";
    b += '<div class="stepfoot"><button class="btn ' + (done ? "ghost" : "primary") +
      '" data-done="' + s.id + '">' + (done ? "◻ ยกเลิกเครื่องหมาย" : "✓ ทำขั้นตอนนี้แล้ว") + "</button></div>";

    return '<div class="card acc step' + (done ? " done" : "") + '" data-step="' + s.id + '">' +
      '<button class="acc-head" aria-expanded="false">' +
      '<span class="num">' + (done ? "✓" : s.id) + "</span>" +
      '<span class="tx">' + esc(s.title) + "</span>" +
      '<span class="ch">▾</span></button>' +
      '<div class="acc-body">' + b + "</div></div>";
  }

  function renderSteps() {
    const list = CONTENT.steps.filter((s) => phaseFilter === "all" || s.phase === phaseFilter);
    const pct = Math.round((state.doneSteps.length / CONTENT.steps.length) * 100);

    let h = '<div class="card"><div class="prog">' +
      '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
      '<div class="pct">' + state.doneSteps.length + "/" + CONTENT.steps.length + "</div>" +
      '</div><div style="padding:0 14px 12px"><button class="btn ghost small" id="resetSteps">ล้างความคืบหน้า</button></div></div>';

    h += '<div class="phasebar"><button class="chip' + (phaseFilter === "all" ? " on" : "") +
      '" data-ph="all">ทั้งหมด</button>' +
      CONTENT.phases.map((p) => '<button class="chip' + (phaseFilter === p.id ? " on" : "") +
        '" data-ph="' + p.id + '">' + p.name + "</button>").join("") + "</div>";

    h += list.map(stepHTML).join("");
    $("#v-steps").innerHTML = h;
  }

  $("#v-steps").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (chip) { phaseFilter = chip.dataset.ph; renderSteps(); return; }

    if (e.target.id === "resetSteps") {
      state.doneSteps = []; save(); renderSteps(); return;
    }

    const d = e.target.closest("[data-done]");
    if (d) {
      const id = Number(d.dataset.done);
      const i = state.doneSteps.indexOf(id);
      if (i === -1) state.doneSteps.push(id); else state.doneSteps.splice(i, 1);
      save();
      const openIds = $$("#v-steps .acc.open").map((a) => a.dataset.step);
      renderSteps();
      openIds.forEach((sid) => {
        const el = $('#v-steps .step[data-step="' + sid + '"]');
        if (el) el.classList.add("open");
      });
    }
  });

  /* =========================================================
     มุมมองที่ 3 — ปัญหาและภาวะแทรกซ้อน
     ========================================================= */
  function renderTrouble() {
    let h = '<div class="card card-pad"><span class="ct" style="font-weight:700">' +
      CONTENT.pains.title + '</span><ul class="pains">' +
      CONTENT.pains.items.map((p) =>
        '<li><span class="k">' + p[0] + "</span><div><div>" + p[2] +
        '</div><div class="en">' + p[1] + "</div></div></li>").join("") +
      "</ul></div>";

    h += '<div class="sec-title">แก้ปัญหาระหว่างทำและภาวะแทรกซ้อน</div>';
    CONTENT.troubles.forEach((t) => {
      let b = '<span class="tag">' + t.tag + "</span>" +
        '<p class="note">' + t.when + "</p>" +
        '<div class="sub-lb">สิ่งที่พบ</div><ul class="blk">' +
        t.signs.map((s) => "<li>" + s + "</li>").join("") + "</ul>" +
        '<div class="sub-lb">การจัดการ</div><ul class="do-list">' +
        t.manage.map((s) => "<li>" + s + "</li>").join("") + "</ul>";
      h += '<div class="card acc"><button class="acc-head" aria-expanded="false">' +
        '<span class="ic">🔎</span><span class="tx">' + esc(t.title) + "</span>" +
        '<span class="ch">▾</span></button><div class="acc-body">' + b + "</div></div>";
    });
    $("#v-trouble").innerHTML = h;
  }

  /* =========================================================
     มุมมองที่ 4 — แบบประเมินทักษะ
     ========================================================= */
  function rubricKey(g, i) { return g + "-" + i; }

  function rubricStats() {
    let total = 0, max = 0, missedCritical = 0, rated = 0, items = 0;
    CONTENT.rubric.groups.forEach((g, gi) => {
      g.items.forEach((it, ii) => {
        items++;
        max += 2;
        const v = state.rubric[rubricKey(gi, ii)];
        if (v !== undefined) { total += v; rated++; }
        if (it.critical && v !== undefined && v < 2) missedCritical++;
      });
    });
    return { total: total, max: max, missedCritical: missedCritical, rated: rated, items: items };
  }

  function renderRubric() {
    const st = rubricStats();
    const pct = st.max ? Math.round((st.total / st.max) * 100) : 0;
    const verdict = st.rated < st.items
      ? { t: "ยังประเมินไม่ครบ (" + st.rated + "/" + st.items + " ข้อ)", tone: "info" }
      : st.missedCritical > 0
        ? { t: "ยังไม่ผ่าน — มีข้อสำคัญ (critical) ที่ทำไม่ถูกต้อง " + st.missedCritical + " ข้อ", tone: "danger" }
        : pct >= 80
          ? { t: "ผ่านเกณฑ์ — คะแนน " + pct + "%", tone: "good" }
          : { t: "ยังไม่ผ่านเกณฑ์ — ต้องได้ตั้งแต่ 80% ขึ้นไป (ได้ " + pct + "%)", tone: "warn" };

    let h = '<div class="card card-pad">' +
      '<h2 style="font-size:17px;margin-bottom:6px">แบบประเมินทักษะหัตถการ</h2>' +
      '<p class="note">ใช้ได้ทั้งการประเมินตนเองหลังฝึกกับหุ่น และให้อาจารย์ประเมินแบบ DOPS ' +
      'ข้อที่ติดป้าย <b>critical</b> คือข้อที่ถ้าทำไม่ถูกต้องถือว่ายังไม่ผ่าน แม้คะแนนรวมจะสูง</p></div>';

    h += '<div class="card"><div class="prog"><div class="bar"><span style="width:' + pct + '%"></span></div>' +
      '<div class="pct">' + st.total + "/" + st.max + "</div></div>" +
      '<div style="padding:0 14px 12px"><div class="callout ' + verdict.tone + '">' + verdict.t + "</div>" +
      '<button class="btn ghost small" id="resetRubric" style="margin-top:10px">ล้างผลประเมิน</button></div></div>';

    CONTENT.rubric.groups.forEach((g, gi) => {
      const gTotal = g.items.reduce((a, _, ii) => a + (state.rubric[rubricKey(gi, ii)] || 0), 0);
      h += '<div class="card"><div class="group-head">' + esc(g.name) +
        "<span>" + gTotal + "/" + g.items.length * 2 + "</span></div>";
      g.items.forEach((it, ii) => {
        const v = state.rubric[rubricKey(gi, ii)];
        h += '<div class="rub-item"><div class="lbl">' +
          (it.critical ? '<span class="crit">critical</span>' : "") +
          "<span>" + esc(it.t) + "</span></div><div class=\"rate\">" +
          CONTENT.rubric.scale.map((s) =>
            '<button data-v="' + s.v + '" data-k="' + rubricKey(gi, ii) + '"' +
            (v === s.v ? ' class="on"' : "") + ' title="' + esc(s.hint) + '">' + s.label + "</button>").join("") +
          "</div></div>";
      });
      h += "</div>";
    });

    $("#v-rubric").innerHTML = h;
  }

  $("#v-rubric").addEventListener("click", (e) => {
    if (e.target.id === "resetRubric") { state.rubric = {}; save(); renderRubric(); return; }
    const b = e.target.closest("[data-k]");
    if (!b) return;
    const k = b.dataset.k, v = Number(b.dataset.v);
    if (state.rubric[k] === v) delete state.rubric[k]; else state.rubric[k] = v;
    save();
    const y = window.scrollY;
    renderRubric();
    window.scrollTo({ top: y });
  });

  /* =========================================================
     มุมมองที่ 5 — ควิซ
     ========================================================= */
  let quiz = { order: [], idx: 0, score: 0, answered: false };

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startQuiz() {
    quiz = { order: shuffle(CONTENT.quiz.map((_, i) => i)), idx: 0, score: 0, answered: false };
    renderQuiz();
  }

  function renderQuiz() {
    const v = $("#v-quiz");

    if (quiz.idx >= quiz.order.length) {
      const pct = Math.round((quiz.score / quiz.order.length) * 100);
      if (state.quizBest === null || pct > state.quizBest) { state.quizBest = pct; save(); }
      v.innerHTML = '<div class="card score">' +
        '<div class="big">' + pct + "%</div>" +
        '<div class="sub">ตอบถูก ' + quiz.score + " จาก " + quiz.order.length + " ข้อ" +
        (state.quizBest !== null ? " • สถิติสูงสุด " + state.quizBest + "%" : "") + "</div>" +
        '<div class="callout ' + (pct >= 80 ? "good" : pct >= 60 ? "warn" : "danger") + '">' +
        (pct >= 80 ? "พร้อมลงฝึกกับหุ่นจำลองแล้ว" :
          pct >= 60 ? "ทบทวนหัวข้อที่ตอบผิดอีกครั้งก่อนลงฝึก" :
            "ควรกลับไปอ่านหมวดเรียนรู้และขั้นตอนหัตถการให้ครบก่อน") + "</div>" +
        '<button class="btn primary" id="againBtn" style="margin-top:14px">เริ่มทำใหม่</button></div>';
      return;
    }

    const q = CONTENT.quiz[quiz.order[quiz.idx]];
    v.innerHTML = '<div class="card card-pad">' +
      '<div class="qmeta"><span>ข้อ ' + (quiz.idx + 1) + " / " + quiz.order.length + "</span>" +
      "<span>ถูก " + quiz.score + " ข้อ</span></div>" +
      '<div class="qtext">' + esc(q.q) + "</div>" +
      q.choices.map((c, i) => '<button class="opt" data-i="' + i + '">' + esc(c) + "</button>").join("") +
      '<div id="expBox"></div></div>';
  }

  $("#v-quiz").addEventListener("click", (e) => {
    if (e.target.id === "againBtn") { startQuiz(); window.scrollTo({ top: 0 }); return; }
    if (e.target.id === "nextBtn") {
      quiz.idx++; quiz.answered = false; renderQuiz(); window.scrollTo({ top: 0 }); return;
    }
    const opt = e.target.closest(".opt");
    if (!opt || quiz.answered) return;

    quiz.answered = true;
    const q = CONTENT.quiz[quiz.order[quiz.idx]];
    const picked = Number(opt.dataset.i);
    if (picked === q.a) quiz.score++;

    $$("#v-quiz .opt").forEach((b, i) => {
      b.disabled = true;
      if (i === q.a) b.classList.add("correct");
      else if (i === picked) b.classList.add("wrong");
    });
    $("#expBox").innerHTML = '<div class="exp"><span class="lb">' +
      (picked === q.a ? "ถูกต้อง" : "ยังไม่ถูก") + "</span>" + q.exp + "</div>" +
      '<button class="btn primary" id="nextBtn" style="margin-top:12px">' +
      (quiz.idx + 1 >= quiz.order.length ? "ดูผลคะแนน" : "ข้อถัดไป") + "</button>";
  });

  /* ---------- boot ---------- */
  renderLearn();
  renderSteps();
  renderTrouble();
  renderRubric();
  startQuiz();
})();

</script>
</body>
</html>
